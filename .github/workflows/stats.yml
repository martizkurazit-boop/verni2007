name: Обновить данные (Метрика и YouTube)

on:
  schedule:
    # Четыре раза в сутки по UTC — чаще нет смысла, Метрика и сама считает с задержкой.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Забрать данные из Метрики
        env:
          METRIKA_TOKEN: ${{ secrets.METRIKA_TOKEN }}
        run: node scripts/fetch-stats.mjs

      # Список выпусков берётся из публичной RSS-ленты канала — ключи не нужны.
      - name: Забрать список выпусков канала
        run: node scripts/fetch-videos.mjs

      - name: Закоммитить, если что-то изменилось
        run: |
          if [ -z "$(git status --porcelain content/stats.json content/videos.json)" ]; then
            echo "Данные не изменились — коммит не нужен."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/stats.json content/videos.json
          git commit -m "Данные: обновление $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git push

name: Проверить ссылки в источниках

# Раз в неделю и по кнопке. Отдельно от выкладки намеренно: чужой сервер,
# недоступный в момент публикации, не должен мешать выходу статьи.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-links.mjs
